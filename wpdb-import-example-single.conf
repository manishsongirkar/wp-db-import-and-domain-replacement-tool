# ===============================================
# WordPress Database Import Configuration - Single Site Example
# ===============================================
# This is an example configuration file for single-site WordPress installations.
# Copy this file to your WordPress root directory as 'wpdb-import.conf'
# and customize the settings for your project.
#
# File Location: Place in the same directory as wp-config.php
# Usage: wp-db-import will automatically detect and use this configuration

[general]
# SQL file to import (relative to WordPress root or absolute path)
sql_file=production-database.sql

# Production domain to search for in the database
old_domain=example.com

# Local development domain to replace with
new_domain=example.test

# Include all database tables (recommended for complete imports)
# Set to false to only process WordPress core tables
all_tables=true

# Run in preview mode without making actual changes
# Set to true for testing, false for actual imports
dry_run=false

# Automatically clear post revisions before search-replace
# Improves performance by reducing database size
clear_revisions=true

# Automatically setup Stage File Proxy plugin for media management
# Allows using production media files without downloading them
setup_stage_proxy=true

# Skip confirmation prompts and proceed automatically
# Set to false for safer, interactive operation
auto_proceed=false

# -----------------------------------------------
# MySQL Socket Settings (optional)
# -----------------------------------------------
# use_socket controls whether to use a Unix socket for the import.
# Socket connections bypass TCP/IP and are significantly faster for
# local development environments (Homebrew MySQL, MAMP, DBngin, etc.).
#
# Values:
#   auto  — Auto-detect socket; fall back to WP-CLI if not found (default)
#   true  — Always require socket; show error if socket cannot be found
#   false — Disable socket; always use WP-CLI (useful for remote/CI envs)
#
use_socket=auto

# Pin a specific socket file path. Leave blank for auto-detection.
# Auto-detection checks Homebrew, MAMP, system MySQL in priority order.
# Examples:
#   mysql_socket=/opt/homebrew/var/mysql/mysql.sock   (macOS Homebrew M1/M2)
#   mysql_socket=/usr/local/var/mysql/mysql.sock      (macOS Homebrew Intel)
#   mysql_socket=/var/run/mysqld/mysqld.sock           (Linux)
#   mysql_socket=/Applications/MAMP/tmp/mysql/mysql.sock  (MAMP)
mysql_socket=

# -----------------------------------------------
# Import Optimization Settings (optional)
# -----------------------------------------------
# Enables session-level SQL flags during direct mysql/socket imports:
#   SET AUTOCOMMIT=0; SET FOREIGN_KEY_CHECKS=0; SET UNIQUE_CHECKS=0;
#
# Values:
#   auto  — Enable for direct mysql/socket imports only (default)
#   true  — Force-enable for direct mysql/socket imports
#   false — Disable import optimizations
import_optimizations=auto

# Parallel import is disabled for generic SQL dumps because statement order
# is significant. Keep false unless using a purpose-built parallel workflow.
parallel_import=false

[site_mappings]
# Format: blog_id:production_domain:local_domain
# For single sites, blog_id is typically 1

# DUAL PURPOSE - This section serves two functions:
# 1. Domain replacement during database import (production_domain → local_domain)
# 2. Stage File Proxy configuration (uses production_domain as source)

# Example mapping for single site:
# 1:example.com:local.test

# If your database contains the domain 'example.com' and you want to replace it with 'local.test'
# while also using 'example.com' as the Stage File Proxy source domain, use:
# 1:example.com:local.test
