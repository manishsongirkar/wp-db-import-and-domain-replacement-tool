# ===============================================
# WordPress Database Import Configuration - Multisite Example
# ===============================================
# This is an example configuration file for WordPress Multisite installations.
# Copy this file to your WordPress root directory as 'wpdb-import.conf'
# and customize the settings for your project.
#
# File Location: Place in the same directory as wp-config.php
# Usage: wp-db-import will automatically detect and use this configuration

[general]
# SQL file to import (relative to WordPress root or absolute path)
sql_file=multisite-production.sql

# Main production domain (usually the network admin domain)
old_domain=admin.example.com

# Main local development domain
new_domain=example.test

# Include all database tables (recommended for complete imports)
# Set to false to only process WordPress core tables
all_tables=true

# Run in preview mode: NOTHING is changed in your database.
# The dump is imported into a temporary database (dropped afterwards), and the tool reports
# the tables and rows it would import, whether the compatibility filter is needed, and how
# many occurrences of the old domain it would replace, per table. Needs the mysql client and
# permission to CREATE DATABASE. Same as the --dry-run command line option.
# Set to true for a preview, false for the real import.
dry_run=false

# Automatically clear post revisions before search-replace
# Improves performance by reducing database size
clear_revisions=true

# Automatically setup Stage File Proxy plugin for media management
# Allows using production media files without downloading them
setup_stage_proxy=true

# Skip confirmation prompts and proceed automatically
# Set to false for safer, interactive operation (recommended for multisite)
auto_proceed=false

# -----------------------------------------------
# MySQL Socket Settings (optional)
# -----------------------------------------------
# use_socket controls whether to use a Unix socket for the import.
# Socket connections bypass TCP/IP and are significantly faster for
# local development environments (Homebrew MySQL, MAMP, DBngin, etc.).
#
# Values:
#   auto  — Auto-detect socket; fall back to WP-CLI if not found (default)
#   true  — Always require socket; show error if socket cannot be found
#   false — Disable socket; always use WP-CLI (useful for remote/CI envs)
#
use_socket=auto

# Pin a specific socket file path. Leave blank for auto-detection.
# Auto-detection checks Homebrew, MAMP, system MySQL in priority order.
# Examples:
#   mysql_socket=/opt/homebrew/var/mysql/mysql.sock   (macOS Homebrew M1/M2)
#   mysql_socket=/usr/local/var/mysql/mysql.sock      (macOS Homebrew Intel)
#   mysql_socket=/var/run/mysqld/mysqld.sock           (Linux)
#   mysql_socket=/Applications/MAMP/tmp/mysql/mysql.sock  (MAMP)
mysql_socket=

# -----------------------------------------------
# Import Optimization Settings (optional)
# -----------------------------------------------
# Enables session-level SQL flags during direct mysql/socket imports:
#   SET AUTOCOMMIT=0; SET FOREIGN_KEY_CHECKS=0; SET UNIQUE_CHECKS=0;
#
# Values:
#   auto  — Enable for direct mysql/socket imports only (default)
#   true  — Force-enable for direct mysql/socket imports
#   false — Disable import optimizations
import_optimizations=auto

# Parallel import is disabled for generic SQL dumps because statement order
# is significant. Keep false unless using a purpose-built parallel workflow.
parallel_import=false

# -----------------------------------------------
# Pre-Import Backup (recommended)
# -----------------------------------------------
# backup_before_import saves a compressed copy of the CURRENT database before
# it is replaced, so a bad import can be undone. If a requested backup fails, the
# import is cancelled to protect your data.
#
# Values:
#   ask   — Ask before each import (Y/n, default Yes). Answering "n" saves false here.
#           Unattended runs (auto_proceed=true) back up without asking. (default)
#   true  — Always back up, never ask
#   false — Never back up, never ask
#
backup_before_import=ask

# backup_dir is where backups are stored (created with mode 700, files 600).
# Leave blank for the default: ~/.wp-db-import/backups
# Restore with:  gunzip -c <backup-file> | wp db import -
backup_dir=

# backup_keep is the number of backups to keep per database. After each new backup the
# oldest ones beyond this number are deleted (rotation), so the folder cannot grow forever.
# Use 0 to keep every backup.
backup_keep=5

[site_mappings]
# Format: blog_id:old_domain:new_domain
# Each line represents one site in your multisite network
#
# Example mappings for a typical multisite setup:
# Main site (ID 1) - Network admin
1:admin.example.com:example.test

# Subsites - Map each production subdomain to local subdirectory
2:blog.example.com:example.test/blog
3:shop.example.com:example.test/shop
4:news.example.com:example.test/news
5:support.example.com:example.test/support
6:docs.example.com:example.test/docs

# Alternative: Subdomain to subdomain mapping
# 2:blog.example.com:blog.example.test
# 3:shop.example.com:shop.example.test

# Note: If your database contains sites not listed here,
# the tool will prompt you to configure them during import
# and automatically add them to this file for future use.

[domain_mappings]
# Extra "search => replace" pairs for URLs that must not reach local or staging
# (CDN hosts, third-party APIs, a www variant). Optional. One pair per line.
# On a multisite network each pair applies to the WHOLE NETWORK (every site).
# The search MUST start with // or http:// or https:// (a bare host would also match emails).
#
# //cdn.example.com => //cdn.local.test              http, https and protocol-relative URLs
# https://api.example.com/v2 => https://api.sandbox.example.net/v2    this exact text only
# //www.example.com => //local.test                  the www variant (old_domain without www does not cover it)
#
# A //host search needs a //newhost replacement. The longest search runs first, before the main
# domain. End a search with / to match the exact host (//example.com/ skips //example.com.au).
# Tip: wp-db-import --dry-run lists the hosts found in the dump and suggests lines.

[site_domain_mappings]
# Multisite only: pairs for ONE site. Format: blog_id: search => replace
# 2: //shop-cdn.example.com => //shop-cdn.example.test
